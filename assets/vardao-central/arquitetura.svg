<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 492" font-family="Roboto, Arial, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#273a60"/>
    </marker>
  </defs>
  <rect width="1000" height="492" fill="#f5f6f9"/>

  <!-- pessoas -->
  <rect x="30" y="60" width="170" height="70" rx="10" fill="#ffffff" stroke="#c9cfdd"/>
  <text x="115" y="90" text-anchor="middle" font-size="16" font-weight="700" fill="#1b2234">Balcão e vendas</text>
  <text x="115" y="112" text-anchor="middle" font-size="13" fill="#4a5066">acesso por perfil</text>
  <rect x="30" y="170" width="170" height="70" rx="10" fill="#ffffff" stroke="#c9cfdd"/>
  <text x="115" y="200" text-anchor="middle" font-size="16" font-weight="700" fill="#1b2234">Gestão e financeiro</text>
  <text x="115" y="222" text-anchor="middle" font-size="13" fill="#4a5066">acesso por perfil</text>

  <!-- front-end -->
  <rect x="270" y="95" width="190" height="90" rx="10" fill="#273a60"/>
  <text x="365" y="128" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">React + TypeScript</text>
  <text x="365" y="150" text-anchor="middle" font-size="13" fill="#dfe5f2">Vite · Tailwind · Vercel</text>

  <!-- API -->
  <rect x="540" y="95" width="200" height="90" rx="10" fill="#273a60"/>
  <text x="640" y="128" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">API Node.js + Express</text>
  <text x="640" y="150" text-anchor="middle" font-size="13" fill="#dfe5f2">login, perfis e loja no servidor</text>
  <text x="640" y="170" text-anchor="middle" font-size="12" fill="#b9c4dc">Render</text>

  <!-- dados -->
  <rect x="800" y="40" width="170" height="80" rx="10" fill="#ffffff" stroke="#c9cfdd"/>
  <text x="885" y="72" text-anchor="middle" font-size="15" font-weight="700" fill="#1b2234">PostgreSQL</text>
  <text x="885" y="94" text-anchor="middle" font-size="12" fill="#4a5066">Supabase · Prisma</text>
  <rect x="800" y="150" width="170" height="80" rx="10" fill="#ffffff" stroke="#c9cfdd"/>
  <text x="885" y="182" text-anchor="middle" font-size="15" font-weight="700" fill="#1b2234">Supabase Storage</text>
  <text x="885" y="204" text-anchor="middle" font-size="12" fill="#4a5066">arquivos privados</text>

  <!-- fila -->
  <rect x="540" y="290" width="200" height="80" rx="10" fill="#ffffff" stroke="#c9cfdd"/>
  <text x="640" y="322" text-anchor="middle" font-size="15" font-weight="700" fill="#1b2234">RabbitMQ</text>
  <text x="640" y="344" text-anchor="middle" font-size="12" fill="#4a5066">leitura de PDFs, com nova tentativa</text>

  <!-- externos -->
  <rect x="270" y="290" width="190" height="80" rx="10" fill="#ffffff" stroke="#f25420"/>
  <text x="365" y="322" text-anchor="middle" font-size="15" font-weight="700" fill="#1b2234">Portal da fabricante</text>
  <text x="365" y="344" text-anchor="middle" font-size="12" fill="#4a5066">consulta pública: troca de código</text>
  <rect x="30" y="290" width="190" height="80" rx="10" fill="#ffffff" stroke="#f25420"/>
  <text x="125" y="322" text-anchor="middle" font-size="15" font-weight="700" fill="#1b2234">ERP antigo</text>
  <text x="125" y="344" text-anchor="middle" font-size="12" fill="#4a5066">arquivos exportados</text>
  <rect x="270" y="400" width="190" height="56" rx="10" fill="#ffffff" stroke="#f25420"/>
  <text x="365" y="425" text-anchor="middle" font-size="15" font-weight="700" fill="#1b2234">Gemini</text>
  <text x="365" y="444" text-anchor="middle" font-size="12" fill="#4a5066">só escolhe em lista fechada</text>

  <!-- setas -->
  <g stroke="#273a60" stroke-width="2" fill="none" marker-end="url(#seta)">
    <path d="M200 95 H268"/><path d="M200 205 L268 160"/>
    <path d="M460 140 H538"/>
    <path d="M740 125 L798 90"/><path d="M740 155 L798 185"/>
    <path d="M640 185 V288"/>
    <path d="M560 185 L462 300" stroke-dasharray="6 5"/>
    <path d="M520 185 L462 410" stroke-dasharray="6 5"/>
    <path d="M125 290 L125 250 L538 165" stroke-dasharray="6 5"/>
  </g>
  <text x="500" y="486" text-anchor="middle" font-size="12" fill="#4a5066">Linhas tracejadas: integrações externas. O ERP antigo é alcançado por arquivos: ensaio, relatório, importação e desfazer.</text>
</svg>
