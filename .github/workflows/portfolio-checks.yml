name: Portfolio checks

on:
  pull_request:
    branches:
      - main
    paths:
      - "meu-portfolio/**"
      - ".github/workflows/portfolio-checks.yml"
  push:
    branches:
      - portfolio/repositionamento-profissional-2026
    paths:
      - "meu-portfolio/**"
      - ".github/workflows/portfolio-checks.yml"

permissions:
  contents: write

jobs:
  validate:
    name: Lint and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: meu-portfolio
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: meu-portfolio/package-lock.json
      - name: Regenerate Portuguese and English resume PDFs
        run: sh curriculos/gerar.sh
      - name: Commit refreshed PDFs to the PR branch
        if: github.event_name == 'pull_request'
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/curriculo-pt.pdf public/assets/curriculo-en.pdf
          if git diff --cached --quiet; then
            echo 'Resume PDFs are already up to date.'
          else
            git commit -m 'Atualiza PDFs dos currículos a partir dos HTMLs'
            git push origin "HEAD:$BRANCH"
          fi
      - name: Install locked dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint
      - name: Build static site
        run: npm run build
      - name: Verify generated routes
        run: |
          test -s dist/index.html
          test -s dist/en/index.html
          test -s dist/estudo-de-caso-vardao-central/index.html
          test -s dist/estudo-de-caso-vardao-central/en/index.html
          grep -q "Desenvolvedor full-stack júnior" dist/index.html
          grep -q "Junior full-stack developer" dist/en/index.html
          echo "Portuguese, English and both Vardão Central case-study routes were generated."
