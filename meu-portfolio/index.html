    <script>
      (function () {
        var t = null;
        var q = /[?&]theme=(light|dark)/.exec(location.search);
        try { t = q ? q[1] : localStorage.getItem('theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = 'dark';
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
