<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" font-family="Roboto, Arial, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#273a60"/>
    </marker>
  </defs>
  <rect width="1000" height="520" fill="#f5f6f9"/>

  <!-- usuários -->
  <rect x="30" y="60" width="170" height="70" rx="10" fill="#ffffff" stroke="#c9cfdd"/>
  <text x="115" y="90" text-anchor="middle" font-size="16" font-weight="700" fill="#1b2234">Balcão</text>
  <text x="115" y="112" text-anchor="middle" font-size="13" fill="#4a5066">PC, mouse e teclado</text>
  <rect x="30" y="170" width="170" height="70" rx="10" fill="#ffffff" stroke="#c9cfdd"/>
  <text x="115" y="200" text-anchor="middle" font-size="16" font-weight="700" fill="#1b2234">Administração</text>
  <text x="115" y="222" text-anchor="middle" font-size="13" fill="#4a5066">preços, negócio, qualidade</text>

  <!-- frontend -->
  <rect x="270" y="95" width="190" height="90" rx="10" fill="#273a60"/>
  <text x="365" y="128" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">React + TypeScript</text>
  <text x="365" y="150" text-anchor="middle" font-size="13" fill="#dfe5f2">Vite · Tailwind · Vercel</text>
  <text x="365" y="170" text-anchor="middle" font-size="12" fill="#b9c4dc">mesmo domínio da API</text>

  <!-- api -->
  <rect x="540" y="95" width="200" height="90" rx="10" fill="#273a60"/>
  <text x="640" y="128" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">API Node.js + Express</text>
  <text x="640" y="150" text-anchor="middle" font-size="13" fill="#dfe5f2">autorização no servidor</text>
  <text x="640" y="170" text-anchor="middle" font-size="12" fill="#b9c4dc">Render</text>

  <!-- dados -->
  <rect x="800" y="40" width="170" height="80" rx="10" fill="#ffffff" stroke="#c9cfdd"/>
  <text x="885" y="72" text-anchor="middle" font-size="15" font-weight="700" fill="#1b2234">PostgreSQL</text>
  <text x="885" y="94" text-anchor="middle" font-size="12" fill="#4a5066">Supabase · Prisma · RLS</text>
  <rect x="800" y="150" width="170" height="80" rx="10" fill="#ffffff" stroke="#c9cfdd"/>
  <text x="885" y="182" text-anchor="middle" font-size="15" font-weight="700" fill="#1b2234">Storage privado</text>
  <text x="885" y="204" text-anchor="middle" font-size="12" fill="#4a5066">catálogos em PDF</text>

  <!-- fila -->
  <rect x="540" y="290" width="200" height="80" rx="10" fill="#ffffff" stroke="#c9cfdd"/>
  <text x="640" y="322" text-anchor="middle" font-size="15" font-weight="700" fill="#1b2234">RabbitMQ</text>
  <text x="640" y="344" text-anchor="middle" font-size="12" fill="#4a5066">CloudAMQP · processamento</text>
  <rect x="800" y="290" width="170" height="80" rx="10" fill="#ffffff" stroke="#c9cfdd"/>
  <text x="885" y="322" text-anchor="middle" font-size="15" font-weight="700" fill="#1b2234">Extração e índice</text>
  <text x="885" y="344" text-anchor="middle" font-size="12" fill="#4a5066">leitura de PDF por regra</text>

  <!-- externos -->
  <rect x="270" y="290" width="190" height="80" rx="10" fill="#ffffff" stroke="#f25420"/>
  <text x="365" y="322" text-anchor="middle" font-size="15" font-weight="700" fill="#1b2234">Portal da fabricante</text>
  <text x="365" y="344" text-anchor="middle" font-size="12" fill="#4a5066">consulta pública: troca de código</text>
  <rect x="30" y="290" width="190" height="80" rx="10" fill="#ffffff" stroke="#f25420"/>
  <text x="125" y="322" text-anchor="middle" font-size="15" font-weight="700" fill="#1b2234">ERP da loja</text>
  <text x="125" y="344" text-anchor="middle" font-size="12" fill="#4a5066">exporta CSV (rede local)</text>
  <rect x="270" y="410" width="190" height="70" rx="10" fill="#ffffff" stroke="#c9cfdd"/>
  <text x="365" y="440" text-anchor="middle" font-size="15" font-weight="700" fill="#1b2234">Gemini</text>
  <text x="365" y="460" text-anchor="middle" font-size="12" fill="#4a5066">só escolhe em lista fechada</text>

  <!-- setas -->
  <g stroke="#273a60" stroke-width="2" fill="none" marker-end="url(#seta)">
    <path d="M200 95 H268"/><path d="M200 205 L268 160"/>
    <path d="M460 140 H538"/>
    <path d="M740 125 L798 90"/><path d="M740 155 L798 185"/>
    <path d="M640 185 V288"/>
    <path d="M740 330 H798"/>
    <path d="M885 290 V232"/>
    <path d="M540 150 L462 320" stroke-dasharray="6 5"/>
    <path d="M520 185 L462 430" stroke-dasharray="6 5"/>
    <path d="M125 290 L125 250 L538 165" stroke-dasharray="6 5"/>
  </g>
  <text x="500" y="500" text-anchor="middle" font-size="12" fill="#4a5066">Linhas tracejadas: integrações externas. O ERP da loja não é alcançável pela nuvem: a integração é exportar, ver o relatório e importar (com desfazer).</text>
</svg>
